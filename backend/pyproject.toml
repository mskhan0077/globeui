[project]
name = "bluegrid-backend"
version = "0.1.0"
description = "BlueGrid API: hybrid renewable microgrid sizing and optimization for Lakshadweep islands"
requires-python = ">=3.10"
dependencies = [
    "flask==3.0.3",
    "gunicorn==22.0.0",
    "numpy==2.1.3",
    "openpyxl==3.1.5",
    "pandas==2.2.2",
    "python-dotenv==1.0.1",
    "requests==2.34.2",
    "scipy==1.15.3",
    "weasyprint==70.0",
]

[dependency-groups]
dev = [
    "pytest==8.2.0",
]
