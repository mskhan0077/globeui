<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}BlueGrid{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <script src="https://cdn.plot.ly/plotly-2.32.0.min.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <h1>BlueGrid</h1>
      <span class="tag">Lakshadweep Hybrid RE Planner</span>
    </div>
    <nav>
      <a href="{{ url_for('main.index') }}">Planner</a>
      <a href="{{ url_for('main.about') }}">About</a>
    </nav>
  </header>
  <main class="container">{% block content %}{% endblock %}</main>
  <footer class="footer">
    Synthetic demo data. Replace with real datasets before planning.
  </footer>
  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
